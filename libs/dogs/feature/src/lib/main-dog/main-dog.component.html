@if (store.loading()) {
  <div>Loading...</div>
} @else {
  <lib-dog-rate
    [currentDog]="store.selectedDog()"
    (rated)="store.rateDog($event)"
    (skipped)="store.selectNextDog()"
  ></lib-dog-rate>

  <lib-dog-list
    [dogs]="store.dogs()"
    (dogSelected)="store.selectDog($event)"
  ></lib-dog-list>
}
