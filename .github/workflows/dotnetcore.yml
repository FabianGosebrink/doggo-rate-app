# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - ratemydog

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: .

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Use Node
        uses: actions/setup-node@v1
        with:
          node-version: "24.11.0"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Restore .NET dependencies
        run: dotnet restore apps/dotnet-dog-api/dotnet-dog-api.csproj

      - name: Build with dotnet in Nx
        run: npm run build:be

      - name: dotnet publish
        run: npm run publish:be

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: apps/dotnet-dog-api/dist/apps/dotnet-dog-api

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: "Production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: "ratemydoggo"
          slot-name: "Production"
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_B935066AA1654F679C6D7AC8B9E9EF8B }}
          package: .
