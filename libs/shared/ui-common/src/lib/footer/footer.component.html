<footer class="py-3 my-4 border-t">
  <div class="flex flex-wrap justify-between">
    <div class="flex flex-col mb-3">
      <span class="mb-3 md:mb-0 text-gray-500"
        >Backend:
        <a [href]="backendUrl() + '/swagger/'" target="_blank"
          >{{ backendUrl() }}
        </a></span
      >
      <span class="mb-3 md:mb-0 text-gray-500"
        >RealTime: {{ realTimeConnection() }}
      </span>
      <span class="mb-3 md:mb-0 text-gray-500"
        >&copy; {{ currentYear }} made with ♥️ by Fabian Gosebrink
      </span>
    </div>
    <div class="flex flex-col mb-3">
      <span class="mb-3 md:mb-0 text-gray-500"
        >Running on platform {{ platform() }}
      </span>
      @if (userEmail()) {
        <span class="mb-3 md:mb-0 text-gray-500"
          >LoggedIn as {{ userEmail() }}
        </span>
      }
    </div>
  </div>
</footer>
